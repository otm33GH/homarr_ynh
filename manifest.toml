packaging_format = 2

id = "homarr"
name = "Homarr"
description.en = "Customizable browser's home page to interact with your homeserver's Docker containers"
description.fr = "Page d'accueil personnalisable pour interagir avec les conteneurs Docker de votre serveur"

version = "1.50.0~ynh2"

maintainers = []

[upstream]
license = "MIT"
website = "https://homarr.dev/"
admindoc = "https://homarr.dev/docs/getting-started"
userdoc = "https://homarr.dev/docs/category/management"
code = "https://github.com/homarr-labs/homarr"

[integration]
yunohost = ">= 12.1.36"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = false

ldap = true
sso = false

disk = "3G"
ram.build = "7G"
ram.runtime = "2G"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
        [resources.sources.main]
        amd64.url = "https://github.com/homarr-labs/homarr/releases/download/v1.50.0/build-debian-amd64.tar.gz"
        amd64.sha256 = "bbad7278bb5b3997a8c64fe830bfeb1666c4a7dd3e0a81b838a2354f409a4caa"
        arm64.url = "https://github.com/homarr-labs/homarr/releases/download/v1.50.0/build-debian-arm64.tar.gz"
        arm64.sha256 = "bacaefaa87fd7fc06496d9411190c6005e4f6416667041b6b7c8255831e51fc4"
        autoupdate.strategy = "latest_github_tag"

    [resources.ports]
        main.default = 3000 
        tasks.default = 3002
        websocket.default = 3003
    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"
    main.auth_headers = false

    [resources.apt]
    packages = "sqlite3, redis-server, ca-certificates" 

    [resources.nodejs]
    version = "24"
